version: '3.8'

services:
  # 1. Ana Veritabanı (PostgreSQL ACID)
  postgres:
    image: postgres:16-alpine
    container_name: boncore_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-boncore_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_DB: ${POSTGRES_DB:-boncore_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-boncore_user} -d $${POSTGRES_DB:-boncore_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. Önbellek & Canlı State (Redis)
  redis:
    image: redis:7-alpine
    container_name: boncore_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  # 3. High-Performance Go Backend & WebSocket API (Fiber)
  backend:
    build:
      context: ./backend-go
      dockerfile: Dockerfile
    container_name: boncore_backend
    restart: always
    environment:
      - AUTH_SECRET_KEY=${AUTH_SECRET_KEY:?AUTH_SECRET_KEY must be set}
      - MASTER_DATABASE_URL=postgres://${POSTGRES_USER:-boncore_user}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@postgres:5432/${POSTGRES_DB:-boncore_db}?sslmode=disable
      - REDIS_URL=redis://redis:6379/0
      - PORT=8000
    ports:
      - "8000:8000"
    volumes:
      - boncore_data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  # 4. Frontend Web Arayüzü & PWA (React + Tailwind CSS)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: boncore_frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

  # 5. Cloudflare Tunnels (Dış Dünyaya Güvenli Açılış - Opsiyonel)
  # cloudflared:
  #   image: cloudflare/cloudflared:latest
  #   container_name: boncore_tunnel
  #   restart: always
  #   command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}
  #   depends_on:
  #     - frontend
  #     - backend

volumes:
  postgres_data:
  redis_data:
  boncore_data:
