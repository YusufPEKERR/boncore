# ============================================================================
# BonCore Enterprise POS — High-Performance Nginx Reverse Proxy Configuration
# Features:
# - HTTP/2 & TLS 1.3 (0-RTT / OCSP Stapling)
# - Zero-Drop WebSocket Tunneling (/ws/*) with 24h Keepalive & No Buffering
# - Upstream Connection Pooling (keepalive 128) to Go Fiber Backend
# - Dual Gzip + Brotli Compression for JSON payloads & static assets
# ============================================================================

user  nginx;
worker_processes  auto;
worker_rlimit_nofile 65535;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  16384;
    use                 epoll;
    multi_accept        on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Low-latency TCP & socket optimizations for POS & KDS real-time traffic
    sendfile           on;
    tcp_nopush         on;
    tcp_nodelay        on;
    keepalive_timeout  75s;
    keepalive_requests 10000;
    types_hash_max_size 2048;
    server_tokens      off;
    client_max_body_size 25m;

    # ------------------------------------------------------------------------
    # GZIP Compression Rules
    # ------------------------------------------------------------------------
    gzip              on;
    gzip_vary         on;
    gzip_proxied      any;
    gzip_comp_level   6;
    gzip_min_length   256;
    gzip_buffers      16 8k;
    gzip_http_version 1.1;
    gzip_types
        application/json
        application/javascript
        application/xml
        application/xml+rss
        text/css
        text/javascript
        text/plain
        text/xml
        image/svg+xml;

    # ------------------------------------------------------------------------
    # BROTLI Compression Rules (Requires ngx_http_brotli_filter_module)
    # Uncomment if running an Nginx build with Brotli module enabled:
    # ------------------------------------------------------------------------
    # brotli            on;
    # brotli_comp_level 6;
    # brotli_static     on;
    # brotli_min_length 256;
    # brotli_types
    #     application/json
    #     application/javascript
    #     application/xml
    #     text/css
    #     text/javascript
    #     text/plain
    #     image/svg+xml;

    # ------------------------------------------------------------------------
    # WebSocket Upgrade Header Mapping
    # Ensures clean RFC 6455 Upgrade when $http_upgrade is present, or keep-alive otherwise
    # ------------------------------------------------------------------------
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # ------------------------------------------------------------------------
    # Go Fiber Backend Upstream Pool (Sub-millisecond Local Loopback / Container)
    # ------------------------------------------------------------------------
    upstream boncore_go_backend {
        least_conn;
        server 127.0.0.1:8000 max_fails=3 fail_timeout=5s;
        # For multi-instance horizontal scaling with Redis Pub/Sub:
        # server 127.0.0.1:8001 max_fails=3 fail_timeout=5s;
        keepalive 128;
        keepalive_requests 10000;
        keepalive_timeout 65s;
    }

    # ------------------------------------------------------------------------
    # HTTP (Port 80) -> HTTPS (Port 443) Redirect
    # ------------------------------------------------------------------------
    server {
        listen 80;
        listen [::]:80;
        server_name pos.boncore.com.tr *.boncore.com.tr localhost;

        location /health {
            proxy_pass http://boncore_go_backend/health;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ------------------------------------------------------------------------
    # HTTPS + HTTP/2 Primary Server Block
    # ------------------------------------------------------------------------
    server {
        listen 443 ssl http2;
        listen [::]:443 ssl http2;
        server_name pos.boncore.com.tr *.boncore.com.tr localhost;

        # TLS 1.2 / 1.3 Certificates & Session Resumption
        ssl_certificate           /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key       /etc/nginx/certs/privkey.pem;
        ssl_protocols             TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;
        ssl_ciphers               ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
        ssl_session_cache         shared:SSL:50m;
        ssl_session_timeout       1d;
        ssl_session_tickets       off;

        # Security Headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        # ====================================================================
        # 1. PERSISTENT WEBSOCKET TUNNEL (/ws/pos, /ws/kds, /ws/table/:id)
        # ====================================================================
        location /ws/ {
            proxy_pass         http://boncore_go_backend;
            proxy_http_version 1.1;

            # Critical WebSocket Upgrade Headers
            proxy_set_header   Upgrade           $http_upgrade;
            proxy_set_header   Connection        $connection_upgrade;

            # Preserve Client & Tenant Metadata
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   X-Restaurant-Code $http_x_restaurant_code;
            proxy_set_header   X-User-Role       $http_x_user_role;

            # Disable proxy buffering for sub-5ms KDS & Table event delivery
            proxy_buffering          off;
            proxy_request_buffering  off;
            proxy_cache              off;

            # Long-lived timeouts so KDS/Waiter screens never drop idle connections
            proxy_connect_timeout    10s;
            proxy_read_timeout       86400s;
            proxy_send_timeout       86400s;
             proxy_socket_keepalive  on;
        }

        # ====================================================================
        # 2. REST API ENDPOINTS (/api/* & /health)
        # ====================================================================
        location /api/ {
            proxy_pass         http://boncore_go_backend;
            proxy_http_version 1.1;

            # Reuse upstream keepalive pool
            proxy_set_header   Connection        "";
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   Authorization     $http_authorization;
            proxy_set_header   X-Restaurant-Code $http_x_restaurant_code;
            proxy_set_header   X-User-Role       $http_x_user_role;

            proxy_connect_timeout 5s;
            proxy_send_timeout    30s;
            proxy_read_timeout    30s;
            proxy_buffering       on;
            proxy_buffer_size     16k;
            proxy_buffers         8 32k;
        }

        location = /health {
            proxy_pass         http://boncore_go_backend/health;
            proxy_http_version 1.1;
            proxy_set_header   Connection "";
            access_log         off;
        }

        # ====================================================================
        # 3. FRONTEND SPA STATIC ASSETS & FALLBACK
        # ====================================================================
        root  /usr/share/nginx/html;
        index index.html;

        location ~* \.(?:js|css|woff2?|ttf|eot|ico|png|jpg|jpeg|webp|svg)$ {
            expires    30d;
            access_log off;
            add_header Cache-Control "public, max-age=2592000, immutable";
            try_files  $uri =404;
        }

        location /downloads/ {
            add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0";
            try_files  $uri =404;
        }

        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
