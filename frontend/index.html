<!doctype html>
<html lang="tr" class="light">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/icon-192.png" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon-180x180.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" sizes="512x512" href="/icon-512.png" />
    <link rel="apple-touch-icon-precomposed" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="application-name" content="BonCore POS" />
    <meta name="apple-mobile-web-app-title" content="BonCore POS" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#338d35" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="description" content="BonCore POS - Web ve Mobil Uyumlu Restoran POS ve Yönetim Sistemi" />
    <title>BonCore POS & Restoran Yönetim Sistemi</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  </head>
  <body class="bg-slate-50 dark:bg-slate-950 text-slate-900 dark:text-slate-100 font-sans antialiased select-none overflow-x-hidden min-h-screen w-full">
    <div id="root" class="min-h-screen w-full"></div>
    <script>
      (function () {
        var rootEl = document.getElementById('root');
        function showBootError(msg) {
          if (!rootEl || rootEl.childNodes.length > 0) return;
          rootEl.innerHTML =
            '<div style="padding:24px;font-family:-apple-system,sans-serif;max-width:520px;margin:40px auto;background:#fff;border:1px solid #e2e8f0;border-radius:16px;color:#0f172a;">' +
            '<h2 style="margin:0 0 8px;font-size:18px;color:#dc2626;">BonCore POS Baslatilamadi</h2>' +
            '<p style="margin:0 0 12px;font-size:13px;color:#475569;">Tarayici uyumluluk veya yukleme hatasi olustu:</p>' +
            '<pre style="white-space:pre-wrap;word-break:break-word;background:#f8fafc;padding:10px;border-radius:8px;font-size:12px;color:#334155;">' +
            String(msg || 'Bilinmeyen hata').replace(/[&<>]/g, function (c) { return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' })[c]; }) +
            '</pre>' +
            '<button onclick="location.reload()" style="margin-top:12px;padding:10px 18px;border:0;border-radius:10px;background:#338d35;color:#fff;font-weight:700;cursor:pointer;">Yeniden Dene</button>' +
            '</div>';
        }
        window.__boncoreShowBootError = showBootError;
        window.addEventListener('error', function (ev) {
          if (ev && ev.message) showBootError(ev.message);
        });
        window.addEventListener('unhandledrejection', function (ev) {
          var reason = ev && ev.reason;
          var msg = (reason && (reason.stack || reason.message)) || reason;
          if (msg) showBootError(msg);
        });
      })();
    </script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function() {
          navigator.serviceWorker.register('/sw.js', { scope: '/' })
            .then(function(reg) {
              console.log('[BonCore SW] Registered with scope:', reg.scope);
            })
            .catch(function(err) {
              console.warn('[BonCore SW] Registration failed:', err);
            });
        });
      }
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
